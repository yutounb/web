<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页 - Web前端作业</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            font-family: "Microsoft Yahei", sans-serif;
            background-color: #e8f4f8;
            padding: 40px 20px;
        }
        .card{
            width: 750px;
            margin: 0 auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.1);
            padding: 40px;
            text-align: center;
        }
        .avatar{
            width:160px;
            height:160px;
            border-radius: 50%;
            object-fit: cover;
            border:4px solid #409eff;
            margin-bottom:20px;
        }
        h1{
            color:#2c3e50;
            margin-bottom:12px;
        }
        .major{
            color:#409eff;
            font-size:19px;
            margin-bottom:25px;
        }
        .intro{
            font-size:17px;
            line-height:1.8;
            color:#555;
            text-align:left;
            padding:0 40px;
        }
        .intro p{
            margin:10px 0;
        }
        .footer{
            margin-top:35px;
            color:#888;
            font-size:15px;
        }
    </style>
</head>
<body>
    <div class="card">
        <img class="avatar" src="https://img2.baidu.com/it/u=3172035999,1547618482&fm=253&app=138&f=JPEG?w=500&h=500" alt="头像">
        <h1>徐梓宁</h1>
        <div class="major">计算机专业学生</div>
        <div class="intro">
            <p>📌 爱好：前端开发、电影、听歌</p>
            <p>📌 个人简介：这是我的第一个网页作业，部署在GitHub Pages，全世界都可以访问。</p>
            <p>📌 技能：学习HTML、CSS，正在入门Web前端。</p>
        </div>
    </div>
</body>
</html>
